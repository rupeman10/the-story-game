}

/* ============================================================ GATES/MODAL */
function modal(html){ const m=el("modal");
  m.innerHTML='<div class="mbox">'+html+'</div>'; m.className="on"; return m; }
function closeModal(){ const m=el("modal"); m.className=""; m.innerHTML=""; }

function playedChapter(c){
  return QUESTIONS.some(q=>q.chapter===c && P.q[q.id] && P.q[q.id].seen>0);
}
/* "Have you read the chapter?" — asked once per chapter; a Yes is remembered. */
function readGate(chs, then){
  P.readAck=P.readAck||{};
  const c=(chs||[]).find(x=>!P.readAck[x] && !playedChapter(x));
  if(c==null){ then(); return; }
  modal('<h3>Have you read Chapter '+c+' yet?</h3>'+
    '<div class="muted">'+esc(chapTitle(c))+'</div>'+
    '<button class="btn go" id="mYes">Yes, I read it</button>'+
    '<button class="btn ghost" id="mNo">Not yet</button>');
  el("mYes").onclick=()=>{ P.readAck[c]=true; saveP(P); closeModal(); readGate(chs,then); };
  el("mNo").onclick=()=>{
    modal('<h3>Reading it first really helps</h3>'+
      '<div class="muted">This game works best as review. If you read Chapter '+c+' first, '+
      'the questions will lock the material in instead of just stumping you.</div>'+
      '<button class="btn primary" id="mCont">Continue anyway</button>'+
      '<button class="btn ghost" id="mBack">Back to chapter menu</button>');
    el("mCont").onclick=()=>{ closeModal(); readGate(chs.filter(x=>x!==c),then); };
    el("mBack").onclick=closeModal;
  };
}
function conceptsHTML(c){
  const ch=CHAPTERS.find(x=>x.n===c); if(!ch||!ch.k) return "";
  return '<h3>Ch '+c+' · '+esc(ch.t)+'</h3><ul class="klist">'+
    ch.k.map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul>';
}
/* Key-concepts reminder — first time a chapter is played each day. */
function conceptsGate(chs, then){
  P.conceptsDay=P.conceptsDay||{};
  const t=todayKey();
  const list=(chs||[]).filter(c=>{ const ch=CHAPTERS.find(x=>x.n===c);
    return ch && ch.k && P.conceptsDay[c]!==t; });
  if(!list.length){ then(); return; }
  const step=(i)=>{
    if(i>=list.length){ closeModal(); then(); return; }
    const c=list[i]; P.conceptsDay[c]=t; saveP(P);
    modal('<div class="klabel">Before you start — remember</div>'+conceptsHTML(c)+
      '<button class="btn go" id="mGo">'+(i<list.length-1?"Next chapter":"Let\u2019s go")+'</button>');
    el("mGo").onclick=()=>step(i+1);
  };
  step(0);
}

/* ============================================== ROUND RESUME (reload-proof)
   The class board (and my updates) republish the artifact, which reloads open
   views. Snapshot the round after every answer so a reload costs nothing. */
function snapKey(){ return NS+".resume."+(P?P.id:""); }
function saveSnap(){
  if(!R) return;
  try{ sessionStorage.setItem(snapKey(), JSON.stringify({
    title:R.title, ids:R.list.map(q=>q.id), bonusIds:R.bonus.map(q=>q.id),
    i:(R.i0snap!=null?R.i0snap:R.i), mode:R.mode, graded:R.graded, chapter:R.chapter, chapters:R.chapters,
    right:R.right, wrong:R.wrong, partial:R.partial, streak:R.streak,
    bestStreak:R.bestStreak, earned:R.earned, possible:R.possible,
    bonusEarned:R.bonusEarned,
    review:R.review.map(r=>({id:r.q.id,verdict:r.verdict,given:r.given,
      missed:r.missed,timeout:r.timeout})) })); }catch(e){}
}
function clearSnap(){ try{ sessionStorage.removeItem(snapKey()); }catch(e){} }
function readSnap(){
  try{ const v=sessionStorage.getItem(snapKey());
    return v?JSON.parse(v):null; }catch(e){ return null; }
}
function offerResume(){
  const sn=readSnap();
  if(!sn || sn.i==null) return false;
  const byId={}; QUESTIONS.forEach(q=>byId[q.id]=q);
  const list=(sn.ids||[]).map(id=>byId[id]).filter(Boolean);
  const bonus=(sn.bonusIds||[]).map(id=>byId[id]).filter(Boolean);
  if(!list.length || sn.i>=list.length+bonus.length){ clearSnap(); return false; }
  modal('<h3>Pick up where you left off?</h3>'+
    '<div class="muted">'+esc(sn.title||"Your round")+' — question '+(sn.i+1)+
    ' of '+(list.length+bonus.length)+'.</div>'+
    '<button class="btn go" id="mRes">Keep going</button>'+
    '<button class="btn ghost" id="mNo2">Start fresh</button>');
  el("mRes").onclick=()=>{ closeModal();
    R={ title:sn.title, list:list, bonus:bonus, i:sn.i, mode:sn.mode,
        graded:!!sn.graded, chapter:sn.chapter, chapters:sn.chapters,
        forceRecognition:false,
        right:sn.right||0, wrong:sn.wrong||0, partial:sn.partial||0,
        streak:sn.streak||0, bestStreak:sn.bestStreak||0,
        earned:sn.earned||0, possible:sn.possible||0,
        bonusEarned:sn.bonusEarned||0,
        review:(sn.review||[]).map(r=>({q:byId[r.id],verdict:r.verdict,
          given:r.given,missed:r.missed,timeout:r.timeout})).filter(r=>r.q),
        answered:false, t0:Date.now() };
    drawQ(); };
  el("mNo2").onclick=()=>{ clearSnap(); closeModal(); };
  return true;
}

/* ================================================================= ROUND */
let R=null;
function startRound(cfg){
  const qs=(cfg.questions||[]).filter(Boolean);
  if(!qs.length){ toast("No questions available for that yet"); scrMap(); return; }
  R = { title:cfg.title, list:qs, bonus:cfg.bonus||[], i:0, mode:cfg.mode,
        graded:!!cfg.graded, chapter:cfg.chapter, chapters:cfg.chapters,
        forceRecognition:!!cfg.forceRecognition,
        right:0, wrong:0, partial:0, streak:0, bestStreak:0,
        earned:0, possible:0, bonusEarned:0, review:[], answered:false, t0:Date.now() };
  drawQ();
}
function allRound(){ return R.list.concat(R.bonus); }
function curQ(){ return allRound()[R.i]; }
function isBonus(){ return R.i>=R.list.length; }

/* Interaction format rises with the Leitner box (playbook §7). */
function formatFor(q){
  if(q.type==="tf") return "tf";
  if(q.type==="mc") return "mc";
  const r=P.q[q.id];
  const box=r?r.box:0;
  if(R.forceRecognition) return "recognition";
  if(R.graded) return "recall";                 // a mock quiz is always written recall
  // multiple choice only on a question's very first exposure; the teacher's
  // quizzes are written, so everything after that is typed recall
  if(!r || !r.seen) return "recognition";
  if(box>=4 && Math.random()<0.5) return "speed";
  return "recall";
}
function drawQ(){
  hideVerdict();
  const q=curQ();
  if(!q){ finishRound(); return; }
  topbar(false);
  const total=allRound().length;
  const fmt=formatFor(q);
  R.fmt=fmt; R.answered=false; R.picked=null;
  const bonus=isBonus();

  let body="";
  if(fmt==="tf"){
    body='<div class="opts">'+["True","False"].map(o=>
      '<button class="opt" data-o="'+o+'">'+o+'</button>').join("")+'</div>';
  } else if(fmt==="mc"){
    const opts=q.options&&q.options.length?q.options:shuffle([q.answer].concat(distractors(q,3)));
    R.opts=opts;
    body='<div class="opts">'+opts.map(o=>
      '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div>';
  } else if(fmt==="recognition"){
    const opts=shuffle([q.answer].concat(distractors(q,3)));
    R.opts=opts;
    body='<div class="opts">'+opts.map(o=>
      '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div>';
  } else if(String(q.answer).indexOf(";")>=0 && q.type!=="list"){
    const n=String(q.answer).split(";").length;
    body='<div class="fills">'+Array.from({length:n},(_,i)=>
      '<div class="fl"><span class="fn">'+(i+1)+'.</span>'+
      '<input class="field ansin" data-i="'+i+'" autocomplete="off" '+
      'autocorrect="off" autocapitalize="off" spellcheck="false"></div>').join("")+'</div>';
  } else {
    body='<input class="field ansin" id="ans" autocomplete="off" autocorrect="off" '+
      'autocapitalize="off" spellcheck="false" placeholder="'+
      (q.type==="list"?"Separate with commas":"Type your answer")+'">';
  }

  const badges=[]
    .concat(bonus?['<span class="badge b-bonus">Bonus · 5 pts</span>']:[])
    .concat(fmt==="speed"?['<span class="badge b-speed">Speed</span>']:[])
    .concat(fmt==="recognition"?['<span class="badge b-recog">Warm-up</span>']:[])
    .concat(['<span class="badge">Ch '+q.chapter+'</span>'])
    .concat(q.source==="predicted"?['<span class="badge">Predicted</span>']:[]);

  window.scrollTo(0,0);
  el("screen").innerHTML=
   '<div class="screen wrap"><div id="roundtop"><div class="row">'+
     '<button class="xbtn" id="quit">×</button>'+
     '<div class="pbar"><i style="width:'+(R.i/total*100)+'%"></i></div>'+
     (fmt==="speed"?'<span class="timer" id="tmr">15</span>':
       '<span class="timer" style="color:var(--ink3)">'+(R.i+1)+'/'+total+'</span>')+
   '</div></div>'+
   '<div class="qhead">'+badges.join("")+'</div>'+
   '<div class="qtext">'+qhtml(q)+'</div>'+ body +
   '<div id="rvz"></div>'+
   '<div class="sp"></div><button class="btn primary" id="check">Check</button></div>';

  el("quit").onclick=()=>{ if(R.i===0||confirm("Leave this round?")) { clearSnap(); R=null; scrMap(); } };
  const check=el("check");
  document.querySelectorAll(".opt").forEach(b=> b.onclick=()=>{
    if(R.answered) return;
    R.picked=b.getAttribute("data-o");
    document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
  });
  const first=$(".ansin");
  if(first){ setTimeout(()=>{ if(document.contains(first)) first.focus(); },90);
    document.querySelectorAll(".ansin").forEach((inp,i,arr)=>{
      inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault();
        if(i<arr.length-1) arr[i+1].focus(); else submit(false); }; };
    }); }
  check.onclick=()=>submit(false);
  if(fmt==="speed") runTimer(15);
}
function qhtml(q){
  let t=esc(q.question).replace(/_{2,}/g,'<span class="blank">______</span>');
  return t;
}
function runTimer(sec){
  const n=el("tmr"); if(!n) return;
  clearInterval(R._t); let left=sec; n.textContent=left;
  R._t=setInterval(()=>{
    left--; if(n) n.textContent=left;
    if(left<=0){ clearInterval(R._t); if(!R.answered) submit(true); }
  },1000);
}
function readAnswer(){
  if(R.fmt==="tf"||R.fmt==="mc"||R.fmt==="recognition") return R.picked||"";
  const ins=document.querySelectorAll(".ansin");
  if(ins.length>1) return [...ins].map(i=>i.value.trim()).join(";");
  return ins.length?ins[0].value:"";
}
function submit(timeout){
  if(R.answered) return;
  const q=curQ();
  const val=readAnswer();
  if(!timeout && !String(val).replace(/;/g,"").trim()){
    const f=$(".ansin")||$(".opts");
    if(f){ f.classList.add("shake"); setTimeout(()=>f.classList.remove("shake"),360); }
    toast("Type an answer, or tap a choice"); return;
  }
  clearInterval(R._t);
  R.answered=true;
  let g = timeout ? {verdict:"wrong",missed:[],score:0} : grade(q,val);
  // Recognition/MC is an exact pick, so grade it as such
  if(R.fmt==="recognition"||R.fmt==="mc")
    g = {verdict: norm(R.picked)===norm(q.answer)?"correct":"wrong", missed:[], score:
      norm(R.picked)===norm(q.answer)?1:0};
  applyResult(q,g,val,timeout);
}
function applyResult(q,g,val,timeout){
  const r=rec(q.id); const wasBox=r.box; const hadMissed=r.wrong>0;
  r.seen++; r.last=todayKey();
  const ok = g.verdict==="correct";
  if(ok){ r.right++; r.box=clamp((r.box||0)+1,1,5); }
  else  { r.wrong++; r.box=1; }

  const pts = ok?5:(g.verdict==="partial"?3:0);
  if(isBonus()) R.bonusEarned+=pts; else { R.earned+=pts; R.possible+=5; }
  if(ok){ R.right++; R.streak++; R.bestStreak=Math.max(R.bestStreak,R.streak);
          if(R.streak>=2) bumpQuest("streak10",0); }
  else  { if(g.verdict==="partial") R.partial++; else R.wrong++; R.streak=0; }
  if(R.streak>0) { const s=P.quests.daily.find(x=>x.id==="streak10");
    if(s && !s.done){ s.progress=Math.max(s.progress,R.streak);
      if(s.progress>=s.target){ s.done=true; addXp(s.reward);
        toast("✅ Quest complete: "+s.label+"  +"+s.reward+" XP"); } } }

  let xp = ok?10:(g.verdict==="partial"?4:2);   // never zero — effort counts
  if(R.fmt==="speed"&&ok) xp+=5;
  if(isBonus()&&ok) xp+=5;
  addXp(xp);
  bumpQuest("answer15"); bumpQuest("answer80");
  if(ok && hadMissed && wasBox<=1){ bumpQuest("trouble3"); award("comeback"); }
  if(ok && R.fmt==="speed"){ P.speedWins=(P.speedWins||0)+1;
    if(P.speedWins>=10) award("speed"); }

  R.review.push({q:q, verdict:g.verdict, given:val, missed:g.missed, timeout:!!timeout});
  R.i0snap=R.i+1; saveSnap();
  ok?sndOk():sndNo();
  markOptions(q,ok);
  showVerdict(q,g,val,timeout,xp);
  saveP(P);
}
function markOptions(q,ok){
  document.querySelectorAll(".opt").forEach(b=>{
    const v=b.getAttribute("data-o");
    if(norm(v)===norm(q.answer)) b.classList.add("right");
    else if(v===R.picked && !ok) b.classList.add("wrongpick");
    if(v===R.picked) b.insertAdjacentHTML("beforeend",
      '<span class="picktag">'+(norm(v)===norm(q.answer)?"✓ your pick":"your pick")+'</span>');
    b.disabled=true;
  });
  document.querySelectorAll(".ansin").forEach(i=>i.disabled=true);
  const c=el("check"); if(c) c.style.display="none";
}
function showVerdict(q,g,val,timeout,xp){
  const ok=g.verdict==="correct";
  if(ok) R.ovrLocked=false;         // an honest machine-graded correct unlocks the claim link
  const heads = ok
    ? ["Yes!","Exactly.","Got it.","That's the one.","Nice."]
    : (timeout?["Time's up."]:["Not quite.","Close — here it is.","Almost."]);
  const head = heads[Math.floor(Math.random()*heads.length)];
  const alt=(q.accept&&q.accept.length)?
    '<div class="vmiss">Also fine: '+esc(q.accept.slice(0,3).join(" · "))+'</div>':"";
  const miss=(g.missed&&g.missed.length && g.verdict!=="correct")?
    '<div class="vmiss">Still missing: <b>'+esc(g.missed.join(", "))+'</b></div>':"";
  const note=q.notes?'<div class="vnote">'+esc(q.notes)+'</div>':"";
  const src=q.page?'<div class="vsrc">The Story of Christianity, p. '+esc(q.page)+'</div>':"";
  const ovr = ok
    ? '<button class="ovrlink" id="ovr">Actually, I was wrong</button>'
    : (R.ovrLocked ? "" : '<button class="ovrlink" id="ovr">My answer was right ✋</button>');
  const rz=el("rvz");
  rz.innerHTML='<div class="reviewcard '+(ok?"ok":"no")+'">'+
    '<div class="vhead">'+(ok?"✓":"○")+' '+head+'<span class="vxp">+'+xp+' XP</span></div>'+
    '<div class="vanslabel">'+(ok?"Answer":"The answer is")+'</div>'+
    '<div class="vansbig">'+esc(q.answer)+'</div>'+
    alt+miss+note+src+ovr+'</div>';
  const v=el("verdict"); v.className = ok?"ok up":"no up";
  el("verdictBody").innerHTML=
    '<button class="btn '+(ok?"go":"primary")+'" id="next">'+
      (R.i>=allRound().length-1?"See results":"Continue")+'</button>';
  el("next").onclick=()=>{ R.i++; drawQ(); };
  const ob=el("ovr"); if(ob) ob.onclick=()=>overrule(q,ok);
  setTimeout(()=>{ if(document.contains(rz)) rz.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
}
/* The grader will get things wrong. One tap fixes it and re-scores. */
function overrule(q,wasOk){
  const r=rec(q.id);
  if(wasOk){
    r.right=Math.max(0,r.right-1); r.wrong++; r.box=1;
    R.right=Math.max(0,R.right-1); R.wrong++;
    if(isBonus()) R.bonusEarned=Math.max(0,R.bonusEarned-5); else R.earned=Math.max(0,R.earned-5);
    addXp(-6);
  }else{
    r.wrong=Math.max(0,r.wrong-1); r.right++; r.box=clamp(r.box+1,1,5);
    const last=R.review[R.review.length-1];
    if(last&&last.verdict!=="correct"){ if(last.verdict==="partial") R.partial--; else R.wrong--; }
    R.right++;
    if(isBonus()) R.bonusEarned+=5; else R.earned+=5;
    addXp(6);
    R.ovrLocked=true;   // one claim per streak — unlocks after the next machine-graded correct
  }
  const last=R.review[R.review.length-1];
  if(last) last.verdict = wasOk?"wrong":"correct";
  saveP(P);
  toast(wasOk?"Marked wrong — it'll come back":"Marked right — nice catch");
  R.i++; drawQ();
}
function hideVerdict(){ el("verdict").className=""; }

function finishRound(){
  clearInterval(R._t); hideVerdict(); clearSnap();
  touchDay(); bumpQuest("round1");
  if(R.mode==="mock") bumpQuest("mock1");
  chaptersWith(null).forEach(c=>{ if(mastery(c)>=0.8) bumpQuest("master1"); });
  chaptersWith(null).forEach(c=>{ if(mastery(c)>=0.999) award("scholar"); });
  award("first");
  const total=R.right+R.wrong+R.partial;
  const pctMain = R.possible? Math.round((R.earned+R.bonusEarned)/R.possible*100) : 0;
  if(R.graded && R.wrong===0 && R.partial===0) award("perfect");
  if(R.wrong===0 && total>=6 && (R.chapter===5||R.chapter===6)) award("martyr");
  P.history.push({d:todayKey(),mode:R.mode,right:R.right,total:total,pct:pctMain});
  P.history=P.history.slice(-60);
  saveP(P);

  const acc = total?Math.round(R.right/total*100):0;
  const graded=R.graded;
  const head = graded
    ? '<div class="scorebig"><div class="pct">'+pctMain+'%</div>'+
      '<div class="pts">'+(R.earned+R.bonusEarned)+' / '+R.possible+' points'+
      (R.bonusEarned?'  (includes '+R.bonusEarned+' bonus)':'')+'</div>'+
      '<div class="cmp">'+compareLine(pctMain)+'</div></div>'
    : '<div class="scorebig"><div class="pct">'+acc+'%</div>'+
      '<div class="pts">'+R.right+' of '+total+' correct</div></div>';

  topbar(true);
  render(head+
    '<div class="statgrid">'+
      '<div class="stat"><div class="n">'+R.right+'</div><div class="l">Right</div></div>'+
      '<div class="stat"><div class="n">'+(R.wrong+R.partial)+'</div><div class="l">To review</div></div>'+
      '<div class="stat"><div class="n">'+R.bestStreak+'</div><div class="l">Best run</div></div>'+
    '</div>'+
    (R.review.some(r=>r.verdict!=="correct")
      ? '<div class="sec-title">Worth another look</div><div class="card tight">'+
        R.review.filter(r=>r.verdict!=="correct").map(r=>
          '<div class="revrow"><span class="mk">'+(r.verdict==="partial"?"◐":"○")+'</span>'+
          '<span><span class="rq">'+esc(r.q.question.replace(/^T or F:\s*/,""))+'</span>'+
          '<span class="ra">'+esc(r.q.answer)+'</span></span></div>').join("")+'</div>'
      : '<div class="card center"><div style="font-size:34px">🎉</div>'+
        '<div style="font-weight:700;margin-top:6px">Clean sweep — nothing to review.</div></div>')+
    '<div class="sp"></div>'+
    (R.review.some(r=>r.verdict!=="correct")
      ? '<button class="btn go" id="again">Retry the '+
        R.review.filter(r=>r.verdict!=="correct").length+' you missed</button>':"")+
    '<button class="btn primary" id="home">Back to the map</button>');

  const missed=R.review.filter(r=>r.verdict!=="correct").map(r=>r.q);
  if(el("again")) el("again").onclick=()=>startRound({title:"Second look",questions:missed,mode:"retry"});
  el("home").onclick=()=>{ const keep=R; R=null; flushCelebs(scrMap); };
  if(!celebQ.length){} else flushCelebs(null);
}
function compareLine(pct){
  const past=[42,66,84];
  const best=Math.max.apply(null,past);
  if(pct>best) return "That would be your best quiz score yet — past best was "+best+"%.";
  if(pct>=84) return "Right in line with your last quiz (84%).";
  if(pct>=66) return "Better than Quiz 2 (66%). Keep pushing.";
  return "Below your recent quizzes — worth another round.";
}

/* ================================================================== MATCH */
function startMatch(chapter){
  const pool=QUESTIONS.filter(q=>q.chapter===chapter && q.type!=="tf" &&
    String(q.answer).length<44);
  const picks=sample(pool,5);
  if(picks.length<3){ toast("Not enough short questions in that chapter"); return; }
  const left=shuffle(picks), right=shuffle(picks);
  let sel=null, done=0, wrong=0; const t0=Date.now();
  topbar(false);
  render('<div id="roundtop"><div class="row"><button class="xbtn" id="quit">×</button>'+
    '<div class="pbar"><i id="mp" style="width:0%"></i></div>'+
    '<span class="timer" id="mt">0s</span></div></div>'+
    '<div class="qhead"><span class="badge">Ch '+chapter+'</span>'+
    '<span class="badge b-recog">Match</span></div>'+
    '<div class="matchgrid">'+
      '<div id="colL">'+left.map(q=>'<button class="mtile" data-side="L" data-id="'+q.id+'">'+
        esc(q.question.replace(/^T or F:\s*/,"")).slice(0,90)+'</button>').join("")+'</div>'+
      '<div id="colR">'+right.map(q=>'<button class="mtile" data-side="R" data-id="'+q.id+'">'+
        esc(q.answer)+'</button>').join("")+'</div>'+
    '</div>');
  const tick=setInterval(()=>{ const n=el("mt");
    if(n) n.textContent=Math.round((Date.now()-t0)/1000)+"s"; },500);
  el("quit").onclick=()=>{ clearInterval(tick); scrMap(); };
  document.querySelectorAll(".mtile").forEach(b=> b.onclick=()=>{
    if(b.classList.contains("gone")) return;
    if(!sel){ sel=b; b.setAttribute("aria-pressed","true"); return; }
    if(sel===b){ sel=null; b.setAttribute("aria-pressed","false"); return; }
    if(sel.getAttribute("data-side")===b.getAttribute("data-side")){
      sel.setAttribute("aria-pressed","false"); sel=b; b.setAttribute("aria-pressed","true"); return; }
    const a=sel; sel=null; a.setAttribute("aria-pressed","false");
    if(a.getAttribute("data-id")===b.getAttribute("data-id")){
      a.classList.add("gone"); b.classList.add("gone"); done++; sndOk();
      const r=rec(a.getAttribute("data-id")); r.seen++; r.right++; r.last=todayKey();
      r.box=clamp((r.box||0)+1,1,5);
      el("mp").style.width=(done/left.length*100)+"%";
      addXp(6); bumpQuest("answer15"); bumpQuest("answer80");
      if(done===left.length){
        clearInterval(tick); touchDay(); bumpQuest("round1");
        if(!wrong) award("matcher");
        saveP(P);
        setTimeout(()=>{
          topbar(true);
          render('<div class="scorebig"><div class="pct">'+Math.round((Date.now()-t0)/1000)+'s'+
            '</div><div class="pts">'+left.length+' pairs · '+wrong+' misses</div></div>'+
            '<button class="btn go" id="again">Another chapter</button>'+
            '<button class="btn primary" id="home">Back to the map</button>');
          el("again").onclick=scrMatchSetup;
          el("home").onclick=()=>flushCelebs(scrMap);
        },420);
      }
    } else {
      wrong++; sndNo();
      [a,b].forEach(x=>{ x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"),420); });
      const r=rec(a.getAttribute("data-id")); r.box=1; r.wrong++; saveP(P);
    }
  });
}

function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Copy failed"); }
  ta.remove();
}

/* ============================================================ SELF-TESTS */
function typo(s){
  const w=String(s).split(" "); let i=w.findIndex(x=>x.length>5);
  if(i<0) i=0;
  const t=w[i]||""; if(t.length<5) return s;
  w[i]=t.slice(0,2)+t.slice(3);            // drop one letter
  return w.join(" ");
}
function graderReport(){
  const rows=[]; let pass=0, fail=0, fp=0;
  QUESTIONS.forEach(q=>{
    const trials=[{in:q.answer,want:true,lab:"exact"}];
    (q.accept||[]).forEach(a=>trials.push({in:a,want:true,lab:"accept"}));
    if(q.type!=="tf"&&q.type!=="mc") trials.push({in:typo(q.answer),want:true,lab:"typo"});
    trials.push({in:"the roman senate of blue elephants",want:false,lab:"nonsense"});
    trials.forEach(t=>{
      const g=grade(q,t.in);
      const ok = t.want ? g.verdict==="correct" : g.verdict!=="correct";
      if(ok) pass++; else { if(t.want) fail++; else fp++;
        rows.push('<tr><td>'+q.id+'</td><td>'+t.lab+'</td><td>'+esc(String(t.in).slice(0,40))+
          '</td><td class="no">'+g.verdict+'</td></tr>'); }
    });
  });
  return '<div class="sp"></div><div><b>'+pass+' passed</b>, <span class="'+(fail?"no":"ok")+'">'+
    fail+' false negatives</span>, <span class="'+(fp?"no":"ok")+'">'+fp+' false positives</span></div>'+
    (rows.length?'<table class="tbl"><tr><th>id</th><th>case</th><th>input</th><th>got</th></tr>'+
      rows.slice(0,40).join("")+'</table>'+
      (rows.length>40?'<div class="muted">…and '+(rows.length-40)+' more</div>':"")
      :'<div class="ok">No failures.</div>');
}
function mockReport(){
  const chs=chaptersWith(null);
  if(chs.length<2) return '<div class="no">Need two covered chapters.</div>';
  const pair=[chs[chs.length-2],chs[chs.length-1]];
  let okMain=0, okBonus=0, okRecyc=0, okWeight=0; const N=50;
  const last=quizNumbers().slice(-1)[0];
  for(let i=0;i<N;i++){
    const m=buildMock(pair);
    if(m.main.length>=8) okMain++;
    if(m.bonus.length>=2) okBonus++;
    if(m.main.filter(q=>q.quiz===last).length>=2) okRecyc++;
    const later=m.main.filter(q=>q.chapter===pair[1]).length/Math.max(1,m.main.length);
    if(later>=0.5&&later<=0.9) okWeight++;
  }
  const row=(l,v)=>'<tr><td>'+l+'</td><td class="'+(v>=N*0.9?"ok":"no")+'">'+v+'/'+N+'</td></tr>';
  return '<div class="sp"></div><table class="tbl">'+
    row("Enough main questions",okMain)+row("3–4 bonus",okBonus)+
    row("2+ recycled from Quiz "+last,okRecyc)+row("Chapter weighting 50–90%",okWeight)+
    '</table><div class="muted">Chapters '+pair.join(" + ")+', '+N+' generated quizzes.</div>';
}

/* Warn when this browser context can't keep progress safe. */
function storageCheck(){
  let works=true;
  try{ localStorage.setItem(NS+".probe","1"); localStorage.removeItem(NS+".probe"); }
  catch(e){ works=false; }
  const ua=navigator.userAgent||"";
  const inApp=/(FBAN|FBAV|Instagram|Line\/|wv\)|GSA\/|Claude)/i.test(ua) ||
    (/(iPhone|iPad)/.test(ua) && !/Safari\//.test(ua));
  if(!works){
    banner("⚠️ This browser is blocking saved data — your progress will NOT survive "+
      "closing this page. Open the link in regular Safari or Chrome instead.");
  } else if(inApp && !read(NS+".inappWarned",false)){
    write(NS+".inappWarned",true);
    banner("💡 You're in an in-app browser, where progress can get wiped. For safe keeping: "+
      "open this link in Safari and use Share → Add to Home Screen.");
  }
}
function banner(msg){
  const b=document.createElement("div");
  b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:70;background:var(--warmsoft);"+
    "color:var(--ink);padding:12px 44px 12px 16px;font-size:13px;line-height:1.45;"+
    "border-bottom:1px solid var(--line);box-shadow:var(--shadow-lift)";
  b.textContent=msg;
  const x=document.createElement("button");
  x.textContent="×";
  x.style.cssText="position:absolute;right:8px;top:8px;background:none;border:none;"+
    "font-size:20px;color:var(--ink2);padding:4px 8px;cursor:pointer";
  x.onclick=()=>b.remove();
  b.appendChild(x); document.body.appendChild(b);
}
