<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Story &mdash; Church History Study Game</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --bg:#f6f1e7; --bg2:#ece3d4; --surface:#fffdf8; --surface2:#f4eee2;
  --ink:#2e2618; --ink2:#6b6051; --ink3:#9a8f7d;
  --line:#e0d6c2;
  --gold:#c1873a; --gold2:#a06f27; --goldsoft:#f6e8cf;
  --green:#4f9d5d; --green2:#3d7d49; --greensoft:#e2f2e2;
  --warm:#c9663f; --warmsoft:#fbe8df;
  --violet:#7a5ba6; --violetsoft:#efe7f7;
  --flame:#e07b39;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(46,38,24,.06), 0 6px 18px rgba(46,38,24,.07);
  --shadow-lift:0 2px 4px rgba(46,38,24,.08), 0 14px 32px rgba(46,38,24,.13);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:640px;
}
html[data-theme="catacomb"]{
  --bg:#14110d; --bg2:#0e0c09; --surface:#1f1a14; --surface2:#282118;
  --ink:#f2ebdd; --ink2:#b7ab97; --ink3:#8a7f6c;
  --line:#352c21;
  --gold:#dda94f; --gold2:#c08f34; --goldsoft:#3a2f1c;
  --green:#6cbb79; --green2:#8ed09a; --greensoft:#1e3222;
  --warm:#e08a60; --warmsoft:#3a241b;
  --violet:#b394d8; --violetsoft:#2b2136; --flame:#f0904a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.5);
}
html[data-theme="manuscript"]{
  --bg:#f2ecf7; --bg2:#e6dcf1; --surface:#fffdfb; --surface2:#f6f0fa;
  --line:#ddd2ea; --gold:#7a5ba6; --gold2:#63478a; --goldsoft:#ece2f7;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}

/* ---------------------------------------------------------------- layout */
#app{min-height:100%;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:var(--maxw);padding:0 16px;margin:0 auto}
#screen{width:100%;flex:1;padding-bottom:32px}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------------------------------------------------------------- topbar */
#topbar{position:sticky;top:0;z-index:30;width:100%;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
#topbar .wrap{display:flex;align-items:center;gap:10px;height:56px}
.tb-face{width:34px;height:34px;border-radius:50%;background:var(--goldsoft);
  display:grid;place-items:center;font-size:19px;flex:none}
.tb-name{font-weight:650;font-size:15px;margin-right:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;
  padding:5px 10px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);white-space:nowrap}
.chip.flame{color:var(--flame)} .chip.xp{color:var(--gold2)}

/* ---------------------------------------------------------------- cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin:14px 0}
.card.tight{padding:14px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin:26px 0 8px}

/* ---------------------------------------------------------------- buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:54px;padding:14px 18px;border-radius:16px;font-weight:750;font-size:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);
  transition:transform .08s,box-shadow .08s,background .15s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--gold);color:#fff;border-color:var(--gold2);
  box-shadow:0 3px 0 var(--gold2)}
.btn.primary:active{box-shadow:none}
.btn.go{background:var(--green);color:#fff;border-color:var(--green2);
  box-shadow:0 3px 0 var(--green2)}
.btn.go:active{box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;
  color:var(--ink2);min-height:44px;font-weight:650}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{width:auto;flex:1}

/* ---------------------------------------------------------------- profiles */
.brandmark{text-align:center;padding:44px 0 8px}
.brandmark .glyph{font-size:52px;line-height:1}
.brandmark h1{font-size:32px;margin-top:10px;letter-spacing:-.01em}
.brandmark p{color:var(--ink2);font-size:14px;margin:8px 0 0}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  text-align:left;width:100%}
.prow:active{transform:scale(.985)}
.prow .face{width:48px;height:48px;border-radius:50%;background:var(--goldsoft);
  display:grid;place-items:center;font-size:26px;flex:none}
.prow .nm{font-weight:700;font-size:17px}
.prow .sub{font-size:13px;color:var(--ink2);margin-top:1px}
.prow .del{margin-left:auto;color:var(--ink3);font-size:20px;padding:8px}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.avatar-grid button{aspect-ratio:1;border-radius:12px;background:var(--surface2);
  font-size:24px;display:grid;place-items:center;border:2px solid transparent}
.avatar-grid button[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.field{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);font-size:17px;outline:none}
.field:focus{border-color:var(--gold)}

/* ---------------------------------------------------------------- map */
.hero{background:linear-gradient(160deg,var(--goldsoft),var(--surface));
  border:1px solid var(--line);border-radius:22px;padding:18px;margin:16px 0;
  box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero .lvl{font-family:var(--serif);font-size:26px;font-weight:700}
.hero .ttl{font-size:13px;color:var(--ink2);font-weight:650}
.bar{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:12px;
  border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.25,1)}
.hero .barlab{display:flex;justify-content:space-between;font-size:12px;
  color:var(--ink2);margin-top:6px;font-weight:600}

.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.modecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;
  min-height:132px;transition:transform .1s}
.modecard:active{transform:scale(.98)}
.modecard .ic{font-size:28px}
.modecard h3{font-size:17px;margin-top:8px}
.modecard p{font-size:12.5px;color:var(--ink2);margin:5px 0 0;line-height:1.35}
.modecard.accent{background:linear-gradient(165deg,var(--greensoft),var(--surface))}
.modecard.accent2{background:linear-gradient(165deg,var(--violetsoft),var(--surface))}

.quest{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qic{width:36px;height:36px;border-radius:10px;background:var(--surface2);
  display:grid;place-items:center;font-size:18px;flex:none}
.quest .qmain{flex:1;min-width:0}
.quest .qlab{font-size:14px;font-weight:650}
.quest .qbar{height:7px;border-radius:999px;background:var(--bg2);margin-top:6px;overflow:hidden}
.quest .qbar>i{display:block;height:100%;background:var(--green);border-radius:999px;
  transition:width .5s ease}
.quest .qrew{font-size:12px;font-weight:750;color:var(--gold2);flex:none}
.quest.done .qlab{color:var(--ink3);text-decoration:line-through}
.quest.done .qrew{color:var(--green)}

.path{position:relative;padding:6px 0 20px}
.path::before{content:"";position:absolute;left:31px;top:14px;bottom:26px;width:3px;
  background:repeating-linear-gradient(var(--line) 0 7px,transparent 7px 14px)}
.node{display:flex;align-items:center;gap:14px;padding:8px 0;position:relative;width:100%;
  text-align:left}
.node .ring{width:64px;height:64px;flex:none;position:relative;display:grid;place-items:center}
.node .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.node .ring .num{font-family:var(--serif);font-size:20px;font-weight:700}
.node .ring .core{width:48px;height:48px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;z-index:1}
.node.done .core{background:var(--green);color:#fff;border-color:var(--green2)}
.node.locked{opacity:.5}
.node .meta{flex:1;min-width:0}
.node .cname{font-weight:700;font-size:15px}
.node .csub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.node .tag{font-size:11px;font-weight:750;padding:2px 8px;border-radius:999px;
  background:var(--surface2);color:var(--ink2);display:inline-block;margin-top:5px}
.node .tag.need{background:var(--warmsoft);color:var(--warm)}
.node.now .core{border-color:var(--gold);border-width:2px;
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,135,58,.4)}50%{box-shadow:0 0 0 9px rgba(193,135,58,0)}}

.trouble{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;
  border-bottom:1px solid var(--line)}
.trouble:last-of-type{border-bottom:0}
.trouble .tq{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink2)}
.trouble .tb{font-size:11px;font-weight:800;color:var(--warm);flex:none}

/* ---------------------------------------------------------------- setup */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipbtn{padding:8px 13px;border-radius:14px;border:2px solid var(--line);text-align:center;
  background:var(--surface);font-weight:650;font-size:14px}
.chipbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft);color:var(--gold2)}
.chipbtn:disabled{opacity:.4}
.chipbtn .cp{display:block;font-size:9.5px;font-weight:650;opacity:.65;margin-top:1px;letter-spacing:.02em}
.optrow{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);
  border-radius:14px;background:var(--surface);margin-bottom:8px;width:100%;text-align:left}
.optrow[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.optrow .oic{font-size:22px}
.optrow .om{flex:1}
.optrow .ot{font-weight:700;font-size:15px}
.optrow .os{font-size:12.5px;color:var(--ink2)}

/* ---------------------------------------------------------------- round */
#roundtop{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px}
#roundtop .row{display:flex;align-items:center;gap:12px}
.xbtn{font-size:22px;color:var(--ink3);padding:4px 8px;flex:none}
.pbar{flex:1;height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;
  border:1px solid var(--line)}
.pbar>i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--green2));
  transition:width .45s cubic-bezier(.2,.8,.25,1)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:var(--violet);flex:none}

.qhead{display:flex;gap:8px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.badge.b-bonus{background:var(--goldsoft);color:var(--gold2)}
.badge.b-speed{background:var(--violetsoft);color:var(--violet)}
.badge.b-recog{background:var(--greensoft);color:var(--green2)}
.qtext{font-family:var(--serif);font-size:23px;line-height:1.34;margin:4px 0 20px}
.qtext .blank{color:var(--gold2);font-weight:700;letter-spacing:.5px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);
  transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.opt.right{border-color:var(--green);background:var(--greensoft);box-shadow:0 3px 0 var(--green)}
.opt.wrongpick{border-color:var(--warm);background:var(--warmsoft);box-shadow:0 3px 0 var(--warm)}
.opt .picktag{float:right;font-size:11px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;opacity:.75;margin-left:8px}
.fills{display:flex;flex-direction:column;gap:10px}
.fills .fl{display:flex;align-items:center;gap:10px}
.fills .fn{font-size:12px;font-weight:800;color:var(--ink3);width:16px;flex:none}
.shake{animation:shake .34s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}
  50%{transform:translateX(-4px)}}

/* ------------------------------------------------------------- verdict */
#verdict{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-lift);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom)}
#verdict.up{transform:none}
#verdict.ok{background:var(--greensoft)}
#verdict.no{background:var(--warmsoft)}
#verdict .wrap{padding-top:16px;padding-bottom:16px}
.vhead{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;
  font-weight:700}
#verdict.ok .vhead{color:var(--green2)} #verdict.no .vhead{color:var(--warm)}
.vans{margin-top:9px;font-size:15px;line-height:1.5}
.vans b{font-weight:750}
.vnote{margin-top:8px;font-size:13.5px;color:var(--ink2);line-height:1.45;
  padding-left:11px;border-left:3px solid var(--line)}
.vmiss{margin-top:8px;font-size:13.5px;color:var(--ink2)}
.vsrc{margin-top:8px;font-size:11.5px;color:var(--ink3);font-weight:650}
.vacts{display:flex;gap:10px;margin-top:14px;align-items:center}
.vacts .btn{flex:1}
.override{font-size:12.5px;font-weight:750;color:var(--ink2);padding:10px 12px;
  border:1px dashed var(--line);border-radius:12px;background:transparent;flex:none}

/* ---------------------------------------------------- review card (mid) */
#rvz{margin-top:18px}
.reviewcard{border-radius:18px;padding:18px 18px 14px;border:1px solid var(--line);
  animation:pop .25s cubic-bezier(.2,.9,.3,1)}
.reviewcard.ok{background:var(--greensoft)} .reviewcard.no{background:var(--warmsoft)}
.reviewcard .vhead{font-size:19px}
.vxp{margin-left:auto;font-size:14px;font-family:var(--sans);opacity:.8;font-weight:700}
.vanslabel{margin-top:13px;font-size:11.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3)}
.vansbig{font-family:var(--serif);font-size:clamp(22px,5.5vw,30px);line-height:1.28;
  font-weight:750;margin-top:5px;color:var(--ink)}
.ovrlink{display:inline-block;margin-top:13px;background:none;border:none;cursor:pointer;
  font-size:12.5px;font-weight:750;color:var(--ink3);text-decoration:underline;
  text-underline-offset:3px;padding:4px 0}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}

/* ------------------------------------------------------------- modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;
  justify-content:center;background:rgba(24,17,8,.45);padding:20px}
#modal.on{display:flex}
.mbox{background:var(--surface);border-radius:20px;max-width:440px;width:100%;
  padding:22px;box-shadow:var(--shadow-lift);max-height:82vh;overflow:auto}
.mbox h3{font-family:var(--serif);font-size:21px;line-height:1.25;margin-bottom:6px}
.mbox .btn{margin-top:10px}
.klabel{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:6px}
.klist{margin:12px 0 4px;padding-left:20px}
.klist li{font-size:14.5px;line-height:1.5;margin-bottom:9px;color:var(--ink2)}
.tag.keys{cursor:pointer;background:var(--goldsoft);color:var(--gold2)}

/* ------------------------------------------------------------- results */
.scorebig{text-align:center;padding:20px 0 6px}
.scorebig .pct{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1}
.scorebig .pts{color:var(--ink2);font-size:15px;margin-top:6px;font-weight:600}
.scorebig .cmp{font-size:13px;color:var(--ink3);margin-top:8px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 8px;text-align:center}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:700}
.stat .l{font-size:11px;color:var(--ink2);font-weight:650;margin-top:2px}
.revrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.revrow:last-child{border-bottom:0}
.revrow .mk{flex:none;font-size:15px}
.revrow .rq{color:var(--ink2)} .revrow .ra{font-weight:700;margin-top:2px}

/* ------------------------------------------------------------- match */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mtile{padding:14px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:600;text-align:left;min-height:66px;box-shadow:0 3px 0 var(--line);
  line-height:1.3}
.mtile[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.mtile.gone{opacity:0;pointer-events:none;transform:scale(.9);transition:all .3s}
.mtile.bad{border-color:var(--warm);background:var(--warmsoft)}

/* ------------------------------------------------------------- celebrate */
#celebrate{position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(3px);text-align:center}
#celebrate.on{display:grid}
#celebrate .glyph{font-size:76px;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#celebrate h2{font-size:30px;margin:14px 0 6px}
#celebrate p{color:var(--ink2);margin:0 0 24px;font-size:15px;padding:0 32px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:59;overflow:hidden}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:.15}}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:70;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:var(--shadow-lift);max-width:88vw;text-align:center}
#toast.up{transform:translate(-50%,0)}

/* ------------------------------------------------------------- admin */
.adm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.adm textarea{width:100%;min-height:150px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface);font-family:inherit;font-size:12px;
  outline:none;resize:vertical}
.adm label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink3);margin:12px 0 5px}
.adm .field{font-size:14px;padding:11px 13px}
.adm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm select{width:100%;padding:11px 13px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);font-size:14px}
.adm .cbrow{display:flex;gap:18px;margin-top:12px;font-size:14px;font-family:var(--sans)}
.adm .cbrow label{display:flex;align-items:center;gap:7px;margin:0;font-size:14px;
  text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}

    {"id": "p12-11", "chapter": 12, "source": "predicted", "type": "short", "page": "124", "question": "On April 30, 311, which dying emperor issued the edict of toleration that ended the persecution?", "answer": "Galerius"},
    {"id": "p12-12", "chapter": 12, "source": "predicted", "type": "short", "page": "124", "question": "How soon after issuing his edict of toleration did Galerius die?", "answer": "Five days later", "accept": ["5 days"], "bonus": true},
    {"id": "p12-13", "chapter": 12, "source": "predicted", "type": "short", "page": "126", "question": "At what battle in 312 did Constantine defeat Maxentius?", "answer": "The battle of the Milvian Bridge", "accept": ["Milvian Bridge"], "pair": "milvian"},
    {"id": "p12-14", "chapter": 12, "source": "predicted", "type": "short", "page": "126", "question": "How did Maxentius die?", "answer": "He drowned (at the Milvian Bridge)", "accept": ["drowned"], "pair": "milvian"},
    {"id": "p12-15", "chapter": 12, "source": "predicted", "type": "short", "page": "125", "question": "Lactantius says Constantine's sign came in a dream. According to Eusebius, how did it appear?", "answer": "As a vision in the sky, with the words 'In this you shall conquer'", "keywords": ["sky", "conquer"]},
    {"id": "p12-16", "chapter": 12, "source": "predicted", "type": "short", "page": "125-126", "question": "What symbol did Constantine order placed on his soldiers' shields and his standard?", "answer": "The Chi-Rho — the first two Greek letters of the name of Christ", "accept": ["Chi-Rho", "the chi rho", "XP"], "keywords": ["chi", "rho"]},
    {"id": "p12-17", "chapter": 12, "source": "predicted", "type": "define", "page": "125", "question": "What was the labarum?", "answer": "Constantine's military standard, which bore the Christian Chi-Rho symbol", "keywords": ["standard", "symbol"]},
    {"id": "p12-18", "chapter": 12, "source": "predicted", "type": "short", "page": "126", "question": "In 313, Constantine and Licinius agreed to stop the persecution in the agreement known as what?", "answer": "The Edict of Milan"},
    {"id": "p12-19", "chapter": 12, "source": "predicted", "type": "tf", "page": "126", "question": "T or F: The Edict of Milan was technically not an edict, and it was not signed in Milan.", "answer": "True", "bonus": true},
    {"id": "p12-20", "chapter": 12, "source": "predicted", "type": "short", "page": "126-127", "question": "In what year did Constantine defeat Licinius and become sole emperor?", "answer": "324", "accept": ["AD 324", "324 AD"]},
    {"id": "q4-01", "quiz": 4, "chapter": 7, "source": "actual", "type": "define", "question": "Define apologetics.", "answer": "The defense of the faith (of Christianity)", "accept": ["the defense of Christianity", "defending the faith"], "keywords": ["defense"], "notes": "Recycled from Quiz 3's bonus — this teacher re-asks definitions.", "page": "59"},
    {"id": "q4-02", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "question": "What were some of the rumors about Christian communion in 1st and 2nd century Rome?", "answer": "That Christians ate children (cannibalism)", "accept": ["cannibalism", "they ate kids", "eating babies"], "keywords": ["ate", "children"], "page": "60"},
    {"id": "q4-03", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "question": "Name several reasons why Romans looked down upon Christians.", "answer": "They did not worship the Roman gods, and they did not worship the emperor", "keywords": ["worship", "gods", "emperor"], "page": "59-63"},
    {"id": "q4-04", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "missed": true, "question": "The Romans considered what essential or primary Christian belief to be complete 'nonsense'?", "answer": "The resurrection", "notes": "Celsus called the final resurrection 'the high point of Christian nonsense.' Not communion — the RESURRECTION.", "page": "62"},
    {"id": "q4-05", "quiz": 4, "chapter": 7, "source": "actual", "type": "list", "missed": true, "question": "What two approaches did Christian philosophers and theologians have to pagan culture?", "answer": "Complete opposition, and finding common points", "accept": ["opposition and common ground", "reject it or build bridges"], "notes": "Tertullian = complete opposition ('What does Athens have to do with Jerusalem?'); Justin = common points (the Logos).", "page": "63-64"},
    {"id": "q4-06", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "missed": true, "question": "Who said, 'What does Athens have to do with Jerusalem?'", "answer": "Tertullian", "notes": "Not Justin! Justin BUILT bridges to philosophy; Tertullian burned them. Opposite men, opposite mottos.", "page": "63"},
    {"id": "q4-07", "quiz": 4, "chapter": 7, "source": "actual", "type": "fill", "missed": true, "question": "According to Tatian, anything the Greeks or Romans had of value they actually stole from the ____.", "answer": "barbarians", "notes": "Astronomy from Babylonians, geometry from Egyptians, writing from Phoenicians — all 'barbarians' to the Greeks.", "page": "64"},
    {"id": "q4-08", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "question": "What is the underlying reason behind the universe?", "answer": "The Logos (God's Word and reason)", "accept": ["the Logos", "the Word"], "page": "65-66", "missed": true, "notes": "Say LOGOS. 'God made it' earned credit on the quiz but was marked wrong on the test — when it counts most, he wants the key term."},
    {"id": "q4-09", "quiz": 4, "chapter": 8, "source": "actual", "type": "define", "missed": true, "question": "What does gnosis mean?", "answer": "Knowledge", "notes": "gnosis = KNOWLEDGE. Logos = word & reason. Two Greek words, two chapters — don't swap them.", "page": "70"},
    {"id": "q4-10", "quiz": 4, "chapter": 8, "source": "actual", "type": "fill", "question": "Gnostics believe that they have received special or secret ____.", "answer": "knowledge", "accept": ["insight", "gnosis"], "page": "70"},
    {"id": "q4-11", "quiz": 4, "chapter": 8, "source": "actual", "type": "fill", "question": "Gnostics believe that the ____ world is evil.", "answer": "material", "accept": ["matter", "physical"], "page": "70-71"},
    {"id": "q4-12", "quiz": 4, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Yes or No: Were gnostic groups for or open to everyone, from every background?", "answer": "No", "accept": ["no"], "notes": "Gnostic gnosis was SECRET — 'clubs, confined and restricted to intellectuals.' The opposite of the open church.", "page": "73"},
    {"id": "q4-13", "quiz": 4, "chapter": 8, "source": "actual", "type": "tf", "missed": true, "question": "T or F: Gnostics believed that Jesus lived and died as part man and part God, that He was God in the flesh, the incarnate Son of God.", "answer": "False", "notes": "They denied real flesh entirely — Docetism: his body only SEEMED human. No incarnation, no real death.", "page": "72"},
    {"id": "q4-14", "quiz": 4, "chapter": 8, "source": "actual", "type": "tf", "question": "T or F: Jesus had secret knowledge that he communicated to His disciples only, or to a particular disciple.", "answer": "False", "page": "80"},
    {"id": "q4-15", "quiz": 4, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Why was Docetism considered a heresy?", "answer": "It taught that Jesus only seemed to have a body", "keywords": ["seemed", "body"], "notes": "From the Greek 'to seem.' If Jesus only seemed human, there was no real incarnation, death, or resurrection.", "page": "72"},
    {"id": "q4-16", "quiz": 4, "chapter": 8, "source": "actual", "type": "fill", "missed": true, "question": "Gnostics were either ascetics or extreme ____.", "answer": "libertines", "accept": ["libertarians"], "notes": "Body-punishers or body-indulgers — both flow from 'the body doesn't matter.'", "page": "72-73"},
    {"id": "q4-17", "quiz": 4, "chapter": 8, "source": "actual", "type": "fill", "missed": true, "question": "As a gender, ____ enjoyed greater freedom, liberty, and more authoritative/leadership roles in Gnostic groups.", "answer": "women", "notes": "If only spirit matters, the body's shape doesn't — so Gnostic circles gave women prominence society denied them.", "page": "73"},
    {"id": "q4-b1", "quiz": 4, "chapter": 7, "source": "actual", "type": "short", "bonus": true, "missed": true, "question": "What is the true light that enlightens everyone according to John's Gospel?", "answer": "The Logos", "accept": ["the Word"], "notes": "'The true light that enlightens' everyone = the Logos — the same Word made flesh in Jesus.", "page": "66"},
    {"id": "q4-b2", "quiz": 4, "chapter": 8, "source": "actual", "type": "short", "bonus": true, "missed": true, "question": "Give an example of a Gnostic text or gospel.", "answer": "The Gospel of Thomas", "accept": ["Gospel of Truth", "Gospel of Judas"], "page": "70"},
    {"id": "q4-b3", "quiz": 4, "chapter": 8, "source": "actual", "type": "short", "bonus": true, "missed": true, "question": "Where were many of the lost gnostic writings discovered, and when?", "answer": "Nag Hammadi, Egypt — in 1945 (the 1940s)", "keywords": ["nag hammadi", "1945"], "accept": ["Nag Hammadi in the 1940s"], "page": "70"},
    {"id": "p9-21", "chapter": 9, "source": "predicted", "type": "fill", "page": "83", "question": "The Shepherd of Hermas deals mostly with the forgiveness of sins after ____.", "answer": "baptism", "predictedHit": true},
    {"id": "p9-22", "chapter": 9, "source": "predicted", "type": "fill", "page": "91", "question": "The Montanists claimed a still newer age was beginning in the outpouring of the ____.", "answer": "Spirit", "accept": ["Holy Spirit"], "notes": "Just as Christ opened a new age, Montanus claimed the Spirit was opening a newer one — THAT claim, not the prophesying, is what the church rejected."},
    {"id": "p9-23", "chapter": 9, "source": "predicted", "type": "short", "page": "91", "question": "Yes or No: Did the church oppose the Montanists because they prophesied?", "answer": "No", "accept": ["no"], "notes": "Women prophesying was not new. The problem was claiming a NEW AGE beyond Christ, which diminished the New Testament."},
    {"id": "p10-21", "chapter": 10, "source": "predicted", "type": "fill", "page": "97", "question": "Trajan's old principle was still in force: Christians were to be punished if accused, but not to be sought ____.", "answer": "out", "notes": "The same policy question has now appeared on two quizzes in different forms — expect it again."},
    {"id": "p10-22", "chapter": 10, "source": "predicted", "type": "short", "page": "101", "question": "Yes or No: Did Decius's edict order that Christians as such be persecuted?", "answer": "No", "accept": ["no"], "notes": "It ordered EVERYONE to sacrifice to the gods and carry a libellum. Christians were caught by a universal law, not named by it."},
    {"id": "p11-22", "chapter": 11, "source": "predicted", "type": "tf", "page": "105", "question": "T or F: Most Christians in the first three centuries came from the upper classes of society.", "answer": "False", "notes": "The vast majority came from society's lower ranks — 'not many of you were wise according to worldly standards.'"},
    {"id": "p11-23", "chapter": 11, "source": "predicted", "type": "fill", "page": "105", "question": "Celsus complained that Christian teaching took place not in schools, but in kitchens, shops, and ____.", "answer": "tanneries", "accept": ["markets"], "notes": "Origen never contradicted him — ordinary people in ordinary places is exactly how the faith spread."},
    {"id": "p11-24", "chapter": 11, "source": "predicted", "type": "short", "page": "109", "question": "Yes or No: Were the unbaptized allowed to stay for the communion part of the service?", "answer": "No", "accept": ["no"], "notes": "They were dismissed with a prayer and blessing after the readings; communion was for the baptized only."},
    {"id": "p12-21", "chapter": 12, "source": "predicted", "type": "fill", "page": "121", "question": "The edict of 303 aimed not to kill Christians, but to remove them from positions of ____.", "answer": "responsibility", "accept": ["power", "leadership"], "notes": "First came dismissal from office and destruction of buildings and books — sterner measures only later."},
    {"id": "p12-22", "chapter": 12, "source": "predicted", "type": "short", "page": "121", "question": "Yes or No: Did Constantius Chlorus enforce the great persecution harshly in his territory?", "answer": "No", "accept": ["no"], "notes": "His region had a slight respite — only some church buildings torn down. He was Constantine's father, and Eusebius liked to make him look good."},
    {"id": "q5-01", "quiz": 5, "chapter": 8, "source": "actual", "type": "define", "question": "What does gnosis mean?", "answer": "Knowledge", "notes": "Recycled from Quiz 4 — the drilling worked; keep it warm, he clearly re-asks it.", "page": "70"},
    {"id": "q5-02", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "question": "Which early heretic founded his own church because his views were seen as 'unorthodox'?", "answer": "Marcion", "page": "73"},
    {"id": "q5-03", "quiz": 5, "chapter": 8, "source": "actual", "type": "tf", "missed": true, "question": "T or F: Marcion believed that there was more than one god.", "answer": "True", "notes": "TWO gods: Yahweh of the Old Testament (justice) and the Father of Jesus (love). That IS more than one god.", "page": "74", "pair": "marcion-gods"},
    {"id": "q5-04", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Marcion believed which god was the god of justice and judgment?", "answer": "Yahweh (the God of the Old Testament)", "accept": ["Yahweh", "the Old Testament God"], "notes": "Yahweh = justice and judgment; the Father of Jesus = love. Keep the pair straight.", "page": "74", "pair": "marcion-gods"},
    {"id": "q5-05", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Which entire section of the Bible did Marcion reject and believe should not be included in Scripture?", "answer": "The Old Testament", "accept": ["the Hebrew scriptures"], "notes": "He rejected the whole Old Testament — it was Yahweh's book. (Not Revelation — that debate came later, for a different reason.)", "page": "74"},
    {"id": "q5-06", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Which parts of the New Testament did Marcion reject?", "answer": "Everything except Luke (and Paul's epistles)", "accept": ["everything except Luke", "all but Luke and Paul"], "keywords": ["everything", "luke"], "notes": "His canon kept ONLY Paul's letters and the Gospel of Luke — everything else was out.", "page": "74-75"},
    {"id": "q5-07", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "question": "Did Marcion believe that there would be a final judgment?", "answer": "No", "page": "74"},
    {"id": "q5-08", "quiz": 5, "chapter": 8, "source": "actual", "type": "tf", "missed": true, "question": "T or F: Marcion's argument about what should or should not be in Scripture forced the church to develop its own list of what was canonical and should be included in the New Testament.", "answer": "True", "notes": "His list was the FIRST attempt at a New Testament — the church answered with its own canon.", "page": "75"},
    {"id": "q5-09", "quiz": 5, "chapter": 8, "source": "actual", "type": "tf", "missed": true, "question": "T or F: Consensus regarding the canon of New Testament Scripture developed gradually.", "answer": "True", "notes": "No council voted it in — the canon formed by gradual consensus over a long time.", "page": "75-77"},
    {"id": "q5-10", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "missed": true, "question": "Why did some later question the Book of Revelation?", "answer": "Because of its harsh view of Rome (the empire)", "keywords": ["harsh", "rome"], "notes": "After Constantine, Revelation's words about the empire 'seemed too harsh.' About ROME — not about Jesus.", "page": "76-77"},
    {"id": "q5-11", "quiz": 5, "chapter": 8, "source": "actual", "type": "short", "question": "What was a 'means of recognition' in the early Church?", "answer": "The symbol (the creed)", "accept": ["the symbol", "a symbol", "the creed"], "page": "77"},
    {"id": "q5-12", "quiz": 5, "chapter": 8, "source": "actual", "type": "fill", "missed": true, "question": "The church in the city of ____ was primarily responsible for the development of the Apostles' Creed.", "answer": "Rome", "notes": "The old ROMAN symbol 'R' (~150) grew into the Apostles' Creed. Rome — not Antioch.", "page": "77-78"},
    {"id": "q5-13", "quiz": 5, "chapter": 8, "source": "actual", "type": "tf", "missed": true, "question": "T or F: Denying both Gnosticism and Marcionism, the Apostles' Creed emphasized Father God's rule over all creation, including the physical, and that Jesus Christ was born, died, rose again, and would return to 'judge the quick and the dead.'", "answer": "True", "notes": "The creed answers the heretics point by point — creation IS God's, Jesus WAS born and truly died, judgment IS coming. All the things Marcion and the Gnostics denied.", "page": "78"},
    {"id": "q5-14", "quiz": 5, "chapter": 8, "source": "actual", "type": "fill", "missed": true, "question": "Over time the Church at large put greater emphasis on authority and ____ succession.", "answer": "apostolic", "notes": "Apostolic succession — the apostles passed the teaching to the bishops.", "page": "79-80"},
    {"id": "q5-b1", "quiz": 5, "chapter": 8, "source": "actual", "type": "define", "bonus": true, "missed": true, "question": "What does canonical mean?", "answer": "Measuring reed (a rule or standard to measure by)", "accept": ["measuring rod", "a rule", "a standard"], "keywords": ["measuring"], "notes": "'Canon' comes from a measuring reed/rod — the canon is the church's measuring stick for Scripture."},
    {"id": "q5-b2", "quiz": 5, "chapter": 8, "source": "actual", "type": "define", "bonus": true, "question": "What did the word 'catholic' originally mean?", "answer": "Universal", "accept": ["according to the whole"], "page": "81"},
    {"id": "q5-b3", "quiz": 5, "chapter": 8, "source": "actual", "type": "define", "bonus": true, "missed": true, "question": "What does bishop mean?", "answer": "Overseer", "notes": "Bishop = overseer. Goes with: presbyter = elder, martyr = witness. He loves word origins."},
    {"id": "p9-24", "chapter": 9, "source": "predicted", "type": "define", "page": "113-114", "question": "What does presbyter mean?", "answer": "Elder", "notes": "Presbyter = elder ('bishop' and 'elder' were interchangeable at first). Etymology questions are a favorite."},
    {"id": "q6-20", "quiz": 6, "chapter": 9, "source": "actual", "type": "fill", "missed": true, "question": "The Apostle John mentored or discipled Polycarp, who in turn discipled ____.", "answer": "Irenaeus", "notes": "IRENAEUS — confirmed by the teacher's own Quiz 6a wording ('Irenaeus was mentored by Polycarp, who was trained by the Apostle John'). The test's red-ink 'Ignatius' was a peer-grading slip.", "page": "53-54"},
    {"id": "q6-22", "quiz": 6, "chapter": 7, "source": "actual", "type": "short", "missed": true, "question": "Who founded a school of philosophy, was one of the first Christian apologists, and was also put to death for his faith?", "answer": "Justin Martyr", "accept": ["Justin"], "notes": "Justin — founded a school in Rome teaching 'the true philosophy,' died a martyr there.", "page": "56-62"},
    {"id": "q6-b1", "quiz": 6, "chapter": 8, "source": "actual", "type": "fill", "bonus": true, "question": "Apostles' Creed: 'I believe in God, the Father ____...'", "answer": "almighty", "page": "77-78", "notes": "Pantokrator — 'all ruling.' Nothing, including the material world, is outside God's rule."},
    {"id": "q6-b2", "quiz": 6, "chapter": 8, "source": "actual", "type": "fill", "bonus": true, "question": "Apostles' Creed: '...born of the ____ and of Mary the Virgin, crucified under Pontius Pilate...'", "answer": "Holy Ghost", "accept": ["Holy Spirit"], "page": "77-78"},
    {"id": "q6-b3", "quiz": 6, "chapter": 8, "source": "actual", "type": "fill", "bonus": true, "question": "Apostles' Creed: '...and will come to judge the ____ and the ____.'", "answer": "quick; dead", "notes": "'The quick' = the LIVING (old English). Judgment of the living and the dead — the very point Marcion denied.", "page": "78"},
    {"id": "q6-b4", "quiz": 6, "chapter": 8, "source": "actual", "type": "fill", "bonus": true, "question": "The old Roman creed confessed 'the resurrection of the ____.'", "answer": "flesh", "accept": ["body", "the dead"], "notes": "Resurrection of the FLESH — the creed's final rejection of the idea that the material body is evil or worthless.", "page": "78"},
    {"id": "q7-01", "quiz": 7, "chapter": 9, "source": "actual", "type": "define", "question": "What does gnosis mean?", "answer": "Knowledge", "notes": "Fourth time he has asked this. It will never stop being worth 8 points.", "page": "70"},
    {"id": "q7-02", "quiz": 7, "chapter": 9, "source": "actual", "type": "tf", "question": "T or F: No one epistle in the New Testament addresses the entirety of theology or church doctrine.", "answer": "True", "notes": "Each epistle was prompted by a particular circumstance — none covers all doctrine.", "page": "83"},
    {"id": "q7-03", "quiz": 7, "chapter": 9, "source": "actual", "type": "tf", "question": "T or F: In the Epistles and in the writings of early church fathers it was common to write to address particular issues.", "answer": "True", "page": "83"},
    {"id": "q7-04", "quiz": 7, "chapter": 9, "source": "actual", "type": "fill", "question": "Irenaeus was mentored by ____, who was mentored and trained by the Apostle John.", "answer": "Polycarp", "notes": "The chain: John → Polycarp → Irenaeus. Irenaeus heard Polycarp teach as a boy.", "page": "84", "pair": "irenaeus-chain"},
    {"id": "q7-05", "quiz": 7, "chapter": 9, "source": "actual", "type": "fill", "question": "Irenaeus' occupation was that of a ____.", "answer": "pastor", "accept": ["bishop", "shepherd of his flock"], "notes": "Above all a PASTOR — a shepherd of his flock (bishop of Lyons). The book contrasts him with Clement, who was 'not a pastor... but a thinker.'", "page": "84"},
    {"id": "q7-06", "quiz": 7, "chapter": 9, "source": "actual", "type": "tf", "question": "T or F: Irenaeus believed human beings were created by God to be free and responsible.", "answer": "True", "page": "84-85"},
    {"id": "q7-07", "quiz": 7, "chapter": 9, "source": "actual", "type": "short", "question": "What is divinization, or how would we explain it based on the writings of Irenaeus?", "answer": "Redeemed humanity growing into ever greater communion with God — becoming more like the divine, a process that continues eternally", "keywords": ["communion", "divine", "growing"], "accept": ["growing closer to God forever", "becoming more like God"], "notes": "'From the very beginning the union of the human with the divine was the goal of history.'", "page": "85"},
    {"id": "q7-08", "quiz": 7, "chapter": 9, "source": "actual", "type": "fill", "question": "According to Clement, the study of Scripture leads to a discovery of the same truth the Greek ____ have known.", "answer": "philosophers", "notes": "'Philosophy was given to the Greeks just as the Law was given to the Jews.'", "page": "87"},
    {"id": "q7-09", "quiz": 7, "chapter": 9, "source": "actual", "type": "fill", "question": "According to Clement, those who are wise go beyond the ____ meaning of Scripture.", "answer": "literal", "notes": "The literal sense stands, but those content with it are 'like children content with milk.'", "page": "87-88"},
    {"id": "q7-10", "quiz": 7, "chapter": 9, "source": "actual", "type": "fill", "question": "Like Philo of Alexandria before him, or Origen after him, Clement embraced ____ical interpretation of Scripture.", "answer": "allegor", "accept": ["allegorical", "allegory"], "notes": "Allegorical — Scripture written 'in parables,' with deeper meanings under the surface.", "page": "87"},
    {"id": "q7-b1", "quiz": 7, "chapter": 9, "source": "actual", "type": "short", "bonus": true, "question": "Name the work that Irenaeus wrote to address the errors of Gnosticism.", "answer": "Against Heresies", "accept": ["Adversus Haereses"], "page": "84"},
    {"id": "q7-b2", "quiz": 7, "chapter": 9, "source": "actual", "type": "short", "bonus": true, "question": "Like Paul, who also wrote an Epistle to the Corinthians?", "answer": "Clement of Rome", "accept": ["Clement"], "notes": "Clement of Rome, late 1st century — addressing problems in the same church Paul had written to.", "page": "83"},
    {"id": "q7-b3", "quiz": 7, "chapter": 9, "source": "actual", "type": "short", "bonus": true, "question": "What second century work deals mostly with the forgiveness of sins after baptism?", "answer": "The Shepherd of Hermas", "accept": ["Shepherd of Hermas", "Hermas"], "notes": "Written by a brother of the bishop of Rome.", "page": "83"},

const STOP = new Set(("the a an and or of to in on at for with by is are was were be been "+

const NUMW = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,

  hundred:100,thousand:1000};

function normBase(s){
  return String(s==null?"":s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[^a-z0-9;\s'-]/g," ")
    .replace(/[-']/g," ")
    .replace(/\b(the|a|an)\b/g," ")
    .replace(/\s+/g," ").trim();
}
function norm(s){
  let t = normBase(s);
  // number words -> digits, incl. simple compounds like "eighty six"
  const w = t.split(" ");
  for(let i=0;i<w.length;i++){
    if(NUMW[w[i]]!=null){
      let v=NUMW[w[i]];
      if(v>=20 && v<100 && NUMW[w[i+1]]!=null && NUMW[w[i+1]]<10){ v+=NUMW[w[i+1]]; w.splice(i+1,1); }
      w[i]=String(v);
    }
  }
  t = w.join(" ").replace(/\s+/g," ").trim();
  return t;
}
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}

function near(a,b){
  if(!a||!b) return false;
  if(a===b) return true;
  const L=Math.max(a.length,b.length);
  if(L<4) return false;
  return lev(a,b) <= clamp(Math.floor(L*0.2),1,3);
}
const stripParens = (s)=> String(s).replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
const insideParens = (s)=>{ const m=String(s).match(/\(([^)]*)\)/g)||[];
  return m.map(x=>x.slice(1,-1).trim()); };

/* Every phrasing we're willing to accept for one expected answer. */
function variants(ans){
  const out=new Set(); const raw=String(ans);
  const push=(v)=>{ const n=norm(v); if(n) out.add(n);
    const b=normBase(v); if(b&&b!==n) out.add(b); };
  push(raw); push(stripParens(raw));
  insideParens(raw).forEach(push);
  // "Logos (Word)" -> also "logos word"; slashes and " or " are alternates
  raw.split(/\s+or\s+|\//i).forEach(p=>{ if(p.trim()){ push(p); push(stripParens(p)); } });
  return [...out];

  return hay.split(" ").some(w=>near(w,tok));
}
function splitItems(s){

    .split(/,| and | & |;|\//i).map(x=>x.trim()).filter(Boolean);
}

  const w = contentWords(ans);

/* Returns {verdict:"correct"|"partial"|"wrong", got, missed:[], score:0..1} */
function grade(q, input){
  const raw = String(input==null?"":input).trim();
  if(!raw) return {verdict:"wrong", missed:[], score:0};
  const user = norm(raw);

  if(q.type==="tf" || q.type==="mc"){
    const a = norm(q.answer);
    const ok = user===a || near(user,a) ||
      (q.type==="mc" && norm(stripParens(q.answer)).indexOf(user)>=0 && user.length>2) ||
      (q.type==="tf" && a.charAt(0)===user.charAt(0) && user.length<=5);
    return {verdict: ok?"correct":"wrong", missed:[], score:ok?1:0};
  }

  // multi-part fill: "Jews; Gentiles"
  if(String(q.answer).indexOf(";")>=0 && q.type!=="list"){
    const parts = String(q.answer).split(";").map(s=>s.trim());
    const ins   = raw.split(";").map(s=>s.trim());
    let hit=0; const miss=[];
    parts.forEach((p,i)=>{
      const cands = variants(p).concat((q.accept||[]).flatMap(variants));
      const u = norm(ins[i]||""), ub = normBase(ins[i]||"");
      if(u && cands.some(c=>c===u||near(c,u)||(ub!==u&&near(c,ub)))) hit++;
      else miss.push(p);
    });
    const sc = hit/parts.length;
    return {verdict: sc===1?"correct":(sc>0?"partial":"wrong"), missed:miss, score:sc};
  }

  // whole-answer match against every accepted phrasing; check both the
  // number-converted form ("86") and the raw word form ("eighty six")
  const userB = normBase(raw);
  const cands = variants(q.answer).concat((q.accept||[]).flatMap(variants));
  if(cands.some(c=> c===user || near(c,user) || (userB!==user && near(c,userB))))
    return {verdict:"correct", missed:[], score:1};
  // student wrote more than needed: "it was pentecost" contains "pentecost"
  if(cands.some(c=> c.length>3 && (user.indexOf(c)>=0 || c.indexOf(user)>=0) &&
      Math.abs(c.length-user.length)<=Math.max(12,c.length*0.9)))
    return {verdict:"correct", missed:[], score:1};

  // list: order-independent, per-item fuzzy (CLAUDE.md requires any order)
  if(q.type==="list"){
    const want = splitItems(q.answer);
    const got  = splitItems(raw);
    const miss=[]; let hit=0;
    want.forEach(item=>{
      const direct = got.some(g=> near(norm(g),norm(item)) || norm(g)===norm(item));
      const words  = contentWords(item);
      const kw = words.length ? words.filter(w=>tokenIn(w,user)).length/words.length : 0;
      if(direct || kw>=0.5) hit++; else miss.push(item);
    });
    const sc = want.length? hit/want.length : 0;
    return {verdict: sc===1?"correct":(sc>0?"partial":"wrong"), missed:miss, score:sc};
  }

  // long prose: curated keywords, else derived content words, 60% threshold
  const keys = (q.keywords && q.keywords.length) ? q.keywords : autoKeywords(q.answer);
  if(keys && keys.length>=3){
    const miss=[]; let hit=0;
    keys.forEach(k=>{
      const toks = norm(k).split(" ").filter(Boolean);
      const okk = toks.length>1
        ? toks.filter(t=>tokenIn(t,user)).length/toks.length >= 0.6
        : tokenIn(toks[0]||"", user);
      if(okk) hit++; else miss.push(k);
    });
    const sc = hit/keys.length;
    if(sc>=0.6) return {verdict:"correct", missed:miss, score:sc};
    if(sc>=0.3) return {verdict:"partial", missed:miss, score:sc};
  }
  return {verdict:"wrong", missed:[], score:0};
}

function touchDay(){
  const t=todayKey();
  if(P.lastPlayed===t) return;
  if(!P.lastPlayed){ P.streak=1; }
  else{
    const gap = dayNum(t)-dayNum(P.lastPlayed);
    if(gap===1) P.streak+=1;
    else if(gap>1){
      const missed=gap-1;
      if(P.freezes>=missed){ P.freezes-=missed;
        toast("❄️ Streak freeze used — your "+P.streak+"-day streak is safe"); P.streak+=1; }
      else { P.streak=1; }
    }
  }
  P.lastPlayed=t;
  P.days=(P.days||[]).concat(t).slice(-90);
  P.best=Math.max(P.best||0,P.streak);
  if(P.streak>0 && P.streak%5===0 && P.freezes<2){ P.freezes++; toast("❄️ Earned a streak freeze"); }
  if(P.streak===3||P.streak===7||P.streak===30)
    queueCeleb({glyph:"🔥",title:P.streak+"-day streak!",body:"Showing up is most of it. Keep going."});
  if(P.streak>=7) award("week");
}
function addXp(n){
  const before=levelFor(P.xp); P.xp+=n;
  if(P.weekXp.week!==weekKey()) P.weekXp={week:weekKey(),xp:0};
  P.weekXp.xp+=n;
  const after=levelFor(P.xp);
  if(after.level>before.level){
    queueCeleb({glyph:"📜",title:"Level "+after.level,body:"You are now a "+after.title+".",
      confetti:true});
    setTimeout(()=>toast("💾 Nice milestone — a backup takes 5 seconds (Settings)"),4000);
  }
  THEMES.forEach(t=>{ if(t.need>0 && before.floor<t.need && P.xp>=t.need)
    toast("🎨 Unlocked the "+t.name+" theme"); });
}
function award(id){
  if(P.badges.indexOf(id)>=0) return;
  const b=BADGES.find(b=>b.id===id); if(!b) return;
  P.badges.push(id);
  queueCeleb({glyph:b.ic,title:b.name,body:b.desc,confetti:true});
}

function bumpQuest(id,by){
  let hit=false;
  [].concat(P.quests.daily||[], P.quests.weekly||[]).forEach(q=>{
    if(q.id!==id||q.done) return;
    q.progress=Math.min(q.target,q.progress+(by||1));
    if(q.progress>=q.target){ q.done=true; hit=true; addXp(q.reward);
      toast("✅ Quest complete: "+q.label+"  +"+q.reward+" XP"); }
  });
  return hit;
}

/* ============================================================== SELECTION */
const BOXW = [4, 10, 6, 3, 1.5, 0.6]; // index 0 = never seen
function pick(pool, n){
  const scored = pool.map(q=>{
    const r=P.q[q.id];
    let w = r ? (BOXW[clamp(r.box,0,5)]||1) : BOXW[0];
    if(q.missed) w*=1.6;                       // real-quiz misses drilled hardest
    if(q.source==="actual") w*=1.25;
    if(r && r.last===todayKey()) w*=0.45;      // don't repeat within the day
    return {q:q, w:w*(0.65+Math.random()*0.7)};
  });
  scored.sort((a,b)=>b.w-a.w);
  return scored.slice(0,n).map(x=>x.q);
}

/* Mock quiz assembled from the teacher's documented habits (CLAUDE.md). */
const TYPE_MIX = {short:0.65, fill:0.12, tf:0.10, define:0.07, list:0.03, mc:0.03};
function buildMock(tokens){
  const entries = tokens.map(parseTok);
  const chs = [...new Set(entries.map(e=>e.ch))].sort((a,b)=>a-b);
  const inCh = (q)=> entries.some(e=>inHalf(q,e.ch,e.half));
  const pool = QUESTIONS.filter(q=> inCh(q) && !q.bonus);
  const bonusPool = QUESTIONS.filter(q=> inCh(q) && (q.bonus || q.type==="define"));
  const nMain = clamp(15+Math.floor(Math.random()*5), 8, Math.max(8,pool.length));
  const out=[]; const used=new Set();
  const take=(q)=>{ if(q && !used.has(q.id)){ used.add(q.id); out.push(q); return true; } return false; };

  // 1. recycle 2-3 from the most recent quiz — he does this every time
  const qn = quizNumbers();
  const forced = new Set();
  if(qn.length){
    const last = qn[qn.length-1];
    const recyc = QUESTIONS.filter(q=>q.quiz===last && !q.bonus);
    sample(recyc, 2+Math.floor(Math.random()*2)).forEach(q=>{ if(take(q)) forced.add(q.id); });
  }
  // 2. chapter weighting — the earlier chapter still gets real weight
  const quota = {};
  if(chs.length>1){
    const later=chs[chs.length-1];
    chs.forEach(c=> quota[c]=Math.round(nMain*(c===later?0.7:0.3/(chs.length-1))));
  } else quota[chs[0]]=nMain;

  // 3. fill each chapter to quota, honouring the observed type mix
  chs.forEach(c=>{
    const want = quota[c] - out.filter(q=>q.chapter===c).length;
    if(want<=0) return;
    const cpool = pool.filter(q=>q.chapter===c && !used.has(q.id));
    const byType = {};
    cpool.forEach(q=>{ (byType[q.type]=byType[q.type]||[]).push(q); });
    let placed=0;
    Object.keys(TYPE_MIX).forEach(t=>{
      const k = Math.round(want*TYPE_MIX[t]);
      sample(byType[t]||[], k).forEach(q=>{ if(placed<want && take(q)) placed++; });
    });
    sample(cpool.filter(q=>!used.has(q.id)), want-placed).forEach(take);
  });
  // 4. top up if a chapter ran thin
  if(out.length<nMain) sample(pool.filter(q=>!used.has(q.id)), nMain-out.length).forEach(take);

  // 5. trim to size without dropping the force-recycled questions,
  //    then keep paired questions adjacent and in order (name -> city -> method)
  let trimmed = shuffle(out);
  while(trimmed.length>nMain){
    const i = trimmed.findIndex(q=>!forced.has(q.id));
    trimmed.splice(i>=0?i:trimmed.length-1,1);
  }
  const main = orderPairs(trimmed);
  const bonus = sample(bonusPool.filter(q=>!used.has(q.id)), 3);
  return {main:main, bonus:bonus};
}
function orderPairs(list){
  const out=[]; const done=new Set();
  list.forEach(q=>{
    if(done.has(q.id)) return;
    out.push(q); done.add(q.id);
    if(q.pair) list.forEach(o=>{ if(o.pair===q.pair && !done.has(o.id)){ out.push(o); done.add(o.id); } });
  });
  return out;
}

/* numeric words and digits that mean the same thing must never face each other */
const NUMEQ = {"four":"4","seven":"7","twelve":"12","seventy":"70","eighty six":"86",
  "three":"3","two":"2","ad 70":"70"};
function numKey(v){ const k=norm(v); return NUMEQ[k]||k.replace(/[^0-9]/g,"")||k; }
const NCATS = {};
Object.keys(CATS).forEach(c=>{ NCATS[c]=new Set(CATS[c].map(x=>norm(x))); });
function answerCat(ans){
  const k=norm(String(ans).replace(/\s*\(.*$/,""));
  for(const c of ["emperor","numberword","year","place","nation","person","group","writing"])
    if(NCATS[c].has(k)) return c;
  if(/^(ad )?\d+$/.test(k)) return "year";
  return null;
}
/* which categories may substitute when the primary runs dry */
const CAT_FRIENDS = { emperor:["person"], person:["emperor"], nation:["place"],
  place:["nation"], numberword:["year"], year:["numberword"], group:["person"],
  writing:[] };
function shapeLike(a,b){
  const wa=String(a).trim().split(/\s+/).length, wb=String(b).trim().split(/\s+/).length;
  if((String(a).length>60)!==(String(b).length>60)) return false;
  if(wa>2*wb+1 || wb>2*wa+1) return false;
  const r=String(a).length/Math.max(1,String(b).length);
  return r>0.35 && r<2.9;
}
function distractors(q,n){
  const seen=new Set([norm(q.answer)]);
  (q.accept||[]).forEach(a=>seen.add(norm(a)));
  const isNum=/^(ad )?\d+$/.test(norm(q.answer))||answerCat(q.answer)==="numberword"||
    answerCat(q.answer)==="year";
  const numSeen=new Set(isNum?[numKey(q.answer)]:[]);
  const out=[];
  const longA=String(q.answer).length>60;
  const ansK=norm(q.answer);
  const take=(list)=>{ shuffle(list).forEach(v=>{ const k=norm(v);
    if(seen.has(k)||out.length>=n) return;
    if(k.includes(ansK)||ansK.includes(k)) return;   // never smuggle the answer into an option
    if((String(v).length>60)!==longA) return;
    if(isNum){ const nk=numKey(v); if(numSeen.has(nk)) return; numSeen.add(nk); }
    seen.add(k); out.push(v); }); };
  const cat=answerCat(q.answer);
  const fromCat=(c)=>{
    const mine=norm(String(q.answer).replace(/\s*\(.*$/,""));
    const near=[], far=[];
    QUESTIONS.forEach(o=>{
      if(o.id===q.id||!o.answer) return;
      if(answerCat(o.answer)!==c) return;
      (Math.abs((o.chapter||0)-(q.chapter||0))<=1?near:far).push(o.answer);
    });
    take(near); take(far);
    if(out.length<n) take(CATS[c].filter(x=>norm(x)!==mine));
  };
  if(cat){
    fromCat(cat);
    (CAT_FRIENDS[cat]||[]).forEach(c=>{ if(out.length<n) fromCat(c); });
  }
  if(out.length<n){        // shape-matched fallback for uncategorized answers
    const same=[], other=[];
    QUESTIONS.forEach(o=>{
      if(o.id===q.id||!o.answer) return;
      if(!shapeLike(q.answer,o.answer)) return;
      (o.chapter===q.chapter?same:other).push(o.answer);
    });
    take(same); take(other);
  }
  if(out.length<n)         // absolute last resort, still shape-guarded
    take(QUESTIONS.filter(o=>o.id!==q.id&&o.answer&&
      (String(o.answer).length>60)===(String(q.answer).length>60)).map(o=>o.answer));
  return out;
}

/* ================================================================== SOUND */
let AC=null;
function beep(freq,dur,type){
  if(!P||!P.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+.02);
  }catch(e){}
}

/* ================================================== BACKUP / RESTORE CODES
   Progress lives in browser storage, which phones sometimes treat as
   disposable (in-app browsers, private mode, storage cleanup). A backup code
   is the escape hatch: profile -> Base64 string -> paste to restore. */
function backupCode(){
  const d={v:1, t:Date.now(), p:P};
  return btoa(unescape(encodeURIComponent(JSON.stringify(d))))
    .replace(/=+$/,"");
}
function parseBackup(code){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!d||!d.p||!d.p.name||typeof d.p.xp!=="number") return null;
    return d;
  }catch(e){ return null; }
}
function restoreBackup(code){
  const d=parseBackup(code);
  if(!d) return "That doesn't look like a backup code — check the paste and try again.";
  const inc=d.p;
  const list=profiles();
  let tgt=list.find(x=>x.id===inc.id);
  const cur=tgt?loadP(inc.id):null;
  if(cur && cur.xp>inc.xp){
    // never let an old code clobber newer progress: keep the richer record
    return "You already have newer progress for "+esc(inc.name)+
      " ("+cur.xp+" XP vs "+inc.xp+" XP in the code) — nothing was changed.";
  }
  if(cur){ // merge per-question boxes, keeping the better-known of each
    inc.q=inc.q||{}; cur.q=cur.q||{};
    Object.keys(cur.q).forEach(id=>{
      if(!inc.q[id] || (cur.q[id].seen||0)>(inc.q[id].seen||0)) inc.q[id]=cur.q[id];
    });
    inc.streak=Math.max(inc.streak||0,cur.streak||0);
  }
  if(!tgt){ list.push({id:inc.id,name:inc.name,avatar:inc.avatar}); saveProfiles(list); }
  saveP(inc);
  return null; // success
}

/* ===================================================== SHARED CLASS BOARD
   Online (published artifact) only. The page stores the board in its own
   board.json via the artifact capability's files publish — the publishing
   view keeps running; other open views reload (they land back on the map).
   Absent capability (file://, read-only share) degrades to a note. */
/* Firestore config — public client values, filled at deploy time. When set,
   the board reads/writes one Firestore doc per player (no conflicts, no
   reloads); when empty, falls back to the artifact-capability mechanism. */
const FIREBOARD = { projectId:"the-story-game-bf349", apiKey:"AIzaSyCBoNA4ZDSTAaBiY8SKQXEw2O9T9xywK5A" };
const fireOn = ()=>!!FIREBOARD.projectId;
const fireBase = ()=>"https://firestore.googleapis.com/v1/projects/"+FIREBOARD.projectId+
  "/databases/(default)/documents/board";
let BOARDDATA = read(NS+".boardcache", {week:null, players:[]});
async function fireLoad(){
  try{
    const r=await fetch(fireBase()+"?pageSize=300&key="+FIREBOARD.apiKey,{cache:"no-store"});
    if(!r.ok) return;
    const j=await r.json();
    const wk=weekKey();
    const players=(j.documents||[]).map(doc=>{
      const f=doc.fields||{};
      const g=(k,kind)=>f[k]?(kind==="i"?parseInt(f[k].integerValue||"0",10):(f[k].stringValue||"")):"";
      return { id:(doc.name||"").split("/").pop(), name:g("name"), avatar:g("avatar"),
        week:g("week"), xp:g("xp","i")||0, streak:g("streak","i")||0, mastered:g("mastered","i")||0 };
    }).filter(p=>p.week===wk && p.name);
    BOARDDATA={week:wk, players:players};
    write(NS+".boardcache",BOARDDATA);
    const n=el("boardZone"); if(n&&P) renderBoard(n);
  }catch(e){/* offline — cached board stands */}
}
async function firePost(){
  const e=myBoardEntry();
  const docId=(e.week+"_"+P.id).replace(/[^A-Za-z0-9_-]/g,"");
  const body={fields:{
    name:{stringValue:String(e.name).slice(0,20)}, avatar:{stringValue:String(e.avatar||"🙂")},
    week:{stringValue:e.week}, xp:{integerValue:String(e.xp)},
    streak:{integerValue:String(e.streak)}, mastered:{integerValue:String(e.mastered)},
    t:{integerValue:String(Date.now())}}};
  try{
    const r=await fetch(fireBase()+"/"+docId+"?key="+FIREBOARD.apiKey,
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){ P.board.posted=e.week+":"+e.xp; saveP(P); fireLoad(); }
  }catch(err){/* offline — next map visit retries */}
}
async function loadBoard(){
  if(fireOn()){ fireLoad(); return; }
  try{
    const r=await fetch("board.json",{cache:"no-store"});
    if(r.ok){ BOARDDATA=await r.json()||{players:[]};
      write(NS+".boardcache",BOARDDATA);
      const n=el("boardZone"); if(n&&P) renderBoard(n); }
  }catch(e){/* file:// or never published — cache stands */}
}
function myBoardEntry(){
  const wk=weekKey();
  return { id:P.id, name:P.name, avatar:P.avatar, week:wk,
    xp:(P.weekXp&&P.weekXp.week===wk)?P.weekXp.xp:0,
    streak:P.streak||0,
    mastered:CHAPTERS.filter(c=>mastery(c.n)>=0.999).length };
}
async function pushBoard(includeMe){
  if(!(window.claude&&claude.use)) return;
  const art=await claude.use("artifact");
  if(!art){ return; }
  const wk=weekKey();
  const b={ week:wk,
    players:(BOARDDATA.players||[]).filter(p=>p.id!==P.id&&p.week===wk) };
  if(includeMe) b.players.push(myBoardEntry());
  try{
    await art.publish({"board.json":{content:JSON.stringify(b),contentType:"application/json"}});
    BOARDDATA=b; write(NS+".boardcache",b);
    if(includeMe){ P.board.posted=wk+":"+myBoardEntry().xp; saveP(P); }
    const n=el("boardZone"); if(n) renderBoard(n);
  }catch(e){
    const code=e&&e.code;
    if(code==="not_writer"||code==="not_granted"||code==="capability_disabled"){
      P.board.readonly=true; saveP(P);
      const n=el("boardZone"); if(n) renderBoard(n);
    }
    /* conflict: another player posted first — their view wins, ours reloads
       or re-posts on the next map visit. rate_limited/upstream: next visit. */
  }
}
function maybePostBoard(){
  if(!P) return;
  P.board=P.board||{};
  const sig=weekKey()+":"+myBoardEntry().xp;
  if(P.board.posted===sig) return;
  if(fireOn()){ firePost(); return; }
  if(P.board.readonly) return;
  pushBoard(true);
}
function renderBoard(n){
  P.board=P.board||{};
  if(!fireOn() && !(window.claude&&claude.use)){
    n.innerHTML='<div class="muted">The class board lives on the online version of the game — '+

  n.innerHTML=
    (rows.length

    ((P.board.readonly&&!fireOn())

        'scores can\u2019t be posted from here.</div>'
      : '<div class="muted" style="margin-top:7px;font-size:11.5px">Every player appears here, '+
        'ranked by XP earned this week — resets every Monday.</div>');
}

      const i=sel.indexOf(t); if(i>=0) sel.splice(i,1); else sel.push(t);
      sel.sort(); draw(); });
    el("back").onclick=scrMap;
    el("go").onclick=()=>{
      const toks=sel.slice();
      const chNums=[...new Set(toks.map(t=>parseTok(t).ch))];
      readGate(chNums, ()=>conceptsGate(chNums, ()=>{
        const mk=buildMock(toks);
        if(mk.main.length<4){ toast("Not enough questions for that selection yet"); return; }
        startRound({title:"Mock Quiz · "+toks.join(", "), questions:mk.main, bonus:mk.bonus,
          mode:"mock", chapters:chNums, graded:true});
      }));
    };
  };
  draw();
}
function scrMatchSetup(){
  const avail=chaptersWith(null);
  render('<div class="sec-title">Match</div>'+
    '<div class="card tight"><div class="muted">Pair each question with its answer as fast as '+
    'you can. Good for names, cities, and how people died — the things this teacher '+
    'likes to ask back to back.</div></div>'+
    '<div class="sec-title">Chapter</div><div class="chips">'+
    avail.map(c=>'<button class="chipbtn" data-c="'+c+'">'+c+'</button>').join("")+'</div>'+
    '<div class="sp"></div><button class="btn ghost" id="back">Back</button>');
